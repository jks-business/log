<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JK's Fruit Soda - Monthly Summary</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eaf7ff 0%, #f6fbff 100%);
      color: #12314d;
    }
    .page {
      max-width: 1200px;
      margin: 28px auto;
      background: white;
      border: 3px solid #0d3b66;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(6, 52, 87, 0.12);
      overflow: hidden;
    }
    .banner {
      background: linear-gradient(135deg, #0b6dc1 0%, #0a4e8d 35%, #1a85d6 100%);
      color: white;
      padding: 24px 28px;
      border-bottom: 4px solid #f4c542;
    }
    .banner h1 {
      margin: 0;
      font-size: 38px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .banner p {
      margin: 8px 0 0;
      font-size: 18px;
      color: #e6f4ff;
      font-weight: bold;
    }
    .content {
      padding: 24px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .topbar h2 {
      margin: 0;
      font-size: 28px;
      color: #0d3b66;
    }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      background: #0d3b66;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .card {
      background: linear-gradient(180deg, #edf7ff 0%, #e7f3ff 100%);
      border: 1px solid #d9ebff;
      border-radius: 12px;
      padding: 16px;
    }
    .label {
      font-size: 12px;
      font-weight: bold;
      color: #4d6c8b;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .value {
      font-size: 30px;
      font-weight: 800;
      color: #0d3b66;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      padding: 12px 10px;
      text-align: center;
      border: 1px solid #dfeaf5;
      font-size: 14px;
    }
    th {
      background: linear-gradient(180deg, #0d3b66 0%, #082847 100%);
      color: white;
    }
    tbody tr:nth-child(even) {
      background: #fafcff;
    }
    .totals-row {
      background: #ebf8ef;
      font-weight: bold;
      color: #0d4d3d;
    }
    .empty {
      padding: 22px;
      text-align: center;
      color: #496a84;
      font-weight: bold;
      background: #f7fbff;
      border: 1px solid #dfeaf5;
      border-radius: 12px;
    }
    @media (max-width: 760px) {
      .summary {
        grid-template-columns: 1fr;
      }
      .banner h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="banner">
      <h1>JK's Fruit Soda</h1>
      <p>Monthly Summary</p>
    </div>

    <div class="content">
      <div class="topbar">
        <h2>Month Overview</h2>
        <div class="button-row">
          <button onclick="window.location.href='index.html'">Back to Daily Log</button>
        </div>
      </div>

      <div class="summary">
        <div class="card">
          <div class="label">Days Logged</div>
          <div class="value" id="daysLogged">0</div>
        </div>
        <div class="card">
          <div class="label">Total Cups Sold</div>
          <div class="value" id="monthCupsSold">0</div>
        </div>
        <div class="card">
          <div class="label">Gross Sales</div>
          <div class="value" id="monthGrossSales">₱0.00</div>
        </div>
        <div class="card">
          <div class="label">Net Sales</div>
          <div class="value" id="monthNetSales">₱0.00</div>
        </div>
      </div>

      <div id="tableWrap"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'fruit_soda_daily_logs';

    function money(value) {
      return '₱' + Number(value || 0).toFixed(2);
    }

    function loadMonthlySummary() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const logs = raw ? JSON.parse(raw) : {};
      const entries = Object.values(logs).sort((a, b) => new Date(a.date) - new Date(b.date));

      const monthCupsSold = entries.reduce((sum, entry) => sum + (Number(entry.totalSold) || 0), 0);
      const monthGrossSales = entries.reduce((sum, entry) => sum + (Number(entry.grossSales) || 0), 0);
      const monthNetSales = entries.reduce((sum, entry) => sum + (Number(entry.netSales) || 0), 0);

      document.getElementById('daysLogged').textContent = entries.length;
      document.getElementById('monthCupsSold').textContent = monthCupsSold;
      document.getElementById('monthGrossSales').textContent = money(monthGrossSales);
      document.getElementById('monthNetSales').textContent = money(monthNetSales);

      if (!entries.length) {
        document.getElementById('tableWrap').innerHTML = '<div class="empty">No saved daily logs yet. Save entries from the Daily Log page first.</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Staff</th>
              <th>Medium Sold</th>
              <th>Large Sold</th>
              <th>Total Cups Sold</th>
              <th>Gross Sales</th>
              <th>Net Sales</th>
            </tr>
          </thead>
          <tbody>
      `;

      entries.forEach((entry) => {
        html += `
          <tr>
            <td>${entry.date || '-'}</td>
            <td>${entry.staff || '-'}</td>
            <td>${Number(entry.mediumSold) || 0}</td>
            <td>${Number(entry.largeSold) || 0}</td>
            <td>${Number(entry.totalSold) || 0}</td>
            <td>${money(entry.grossSales || 0)}</td>
            <td>${money(entry.netSales || 0)}</td>
          </tr>
        `;
      });

      html += `
          <tr class="totals-row">
            <td colspan="2">TOTAL</td>
            <td>${entries.reduce((sum, e) => sum + (Number(e.mediumSold) || 0), 0)}</td>
            <td>${entries.reduce((sum, e) => sum + (Number(e.largeSold) || 0), 0)}</td>
            <td>${monthCupsSold}</td>
            <td>${money(monthGrossSales)}</td>
            <td>${money(monthNetSales)}</td>
          </tr>
      `;

      html += '</tbody></table>';
      document.getElementById('tableWrap').innerHTML = html;
    }

    loadMonthlySummary();
  </script>
</body>
</html>
